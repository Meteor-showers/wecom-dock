name: 发布镜像

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]*"
      - "!v*alpha*"
      - "!v*beta*"
      - "!v*preview*"
      - "!v*rc*"
  workflow_dispatch:
    inputs:
      tag:
        description: "指定版本，例如 v1.2.0。留空则自动递增修订号"
        required: false
        default: ""

concurrency:
  group: docker-publish
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    environment: DOCKERHUB
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 确定版本号
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          git fetch --tags --force
          is_semver() {
            echo "$1" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          }
          highest() {
            git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true
          }
          bump() {
            local latest="$1"
            if [ -z "$latest" ]; then
              echo v1.0.0
              return
            fi
            local ver="${latest#v}"
            local major="${ver%%.*}"
            local rest="${ver#*.}"
            local minor="${rest%%.*}"
            local patch="${rest#*.}"
            echo "v${major}.${minor}.$((patch + 1))"
          }
          version=""
          create=0
          if [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            version="$INPUT_TAG"
            create=1
          else
            pointed="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [ -n "$pointed" ]; then
              version="$pointed"
            else
              version="$(bump "$(highest)")"
              create=1
            fi
          fi
          if ! is_semver "$version"; then
            echo "版本号必须是 v1.2.3 这种格式" >&2
            exit 1
          fi
          if [ "$create" = "1" ]; then
            if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              echo "版本 $version 已存在" >&2
              exit 1
            fi
            git tag "$version"
            git push origin "refs/tags/$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: 检查 Docker Hub 密钥
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "请在仓库 Settings → Secrets and variables → Actions 添加 DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN"
            exit 1
          fi

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            plutosdocker/wecom-dock
            ghcr.io/meteor-showers/wecom-dock
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=semver,pattern=v{{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.version.outputs.version }}

      - name: 登录 Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          user=$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')
          token=$(printf '%s' "$DOCKERHUB_TOKEN" | tr -d '[:space:]')
          echo "username_len=${#user} token_len=${#token}"
          case "$token" in
            dckr_pat_*) echo "token_kind=pat" ;;
            *) echo "token_kind=other" ;;
          esac
          if ! printf '%s' "$user" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]*$'; then
            echo "DOCKERHUB_USERNAME 应该只填 Docker Hub 用户名，例如 plutosdocker。不要填邮箱、引号、中文或 Access Token。"
            exit 1
          fi
          if ! printf '%s' "$token" | grep -Eq '^[A-Za-z0-9._~+/-]+=*$'; then
            echo "DOCKERHUB_TOKEN 里有异常字符。到 Docker Hub → Account Settings → Personal access tokens 重新复制，只粘贴一行令牌。"
            exit 1
          fi
          hub_status=$(U="$user" T="$token" python3 - <<'PY'
import json, os, urllib.request, urllib.error
req = urllib.request.Request(
    "https://hub.docker.com/v2/users/login/",
    data=json.dumps({"username": os.environ["U"], "password": os.environ["T"]}).encode(),
    headers={"Content-Type": "application/json"},
    method="POST",
)
try:
    with urllib.request.urlopen(req, timeout=30) as resp:
        print(resp.status)
except urllib.error.HTTPError as err:
    print(err.code)
PY
)
          echo "hub_login_status=$hub_status"
          if [ "$hub_status" != "200" ]; then
            echo "Docker Hub 拒绝了这对用户名和令牌。请新建一个 Personal Access Token（以 dckr_pat_ 开头，权限含 Read & Write），用户名填 plutosdocker，然后更新 DOCKERHUB 环境里的两个密钥。"
            exit 1
          fi
          printf '%s' "$token" | docker login docker.io --username "$user" --password-stdin

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            USE_CN_MIRROR=0
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/Meteor-showers/wecom-dock
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
